<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Friend Surprise ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
    animation:bgMove 10s infinite alternate;
    font-family:Arial,sans-serif;
}

@keyframes bgMove{
    from{
        filter:hue-rotate(0deg);
    }
    to{
        filter:hue-rotate(40deg);
    }
}

/* Heart */

.heart{
    position:relative;
    width:170px;
    height:170px;
    background:#ff1744;
    transform:rotate(-45deg);
    animation:beat 1s infinite;
    box-shadow:0 0 30px #ff1744,
               0 0 60px #ff1744,
               0 0 90px #ff1744;
    display:flex;
    justify-content:center;
    align-items:center;
}

.heart::before,
.heart::after{
    content:'';
    position:absolute;
    width:170px;
    height:170px;
    background:#ff1744;
    border-radius:50%;
}

.heart::before{
    top:-85px;
    left:0;
}

.heart::after{
    left:85px;
    top:0;
}

@keyframes beat{
    0%,100%{
        transform:rotate(-45deg) scale(1);
    }
    50%{
        transform:rotate(-45deg) scale(1.15);
    }
}

.heart-text{
    position:absolute;
    transform:rotate(45deg);
    color:white;
    font-size:22px;
    font-weight:bold;
    text-align:center;
    z-index:5;
}

/* Message */

.message{
    position:absolute;
    bottom:60px;
    color:white;
    font-size:28px;
    font-weight:bold;
    text-shadow:0 0 15px red;
}

/* Button */

#showBtn{
    position:absolute;
    bottom:120px;
    padding:15px 35px;
    font-size:20px;
    border:none;
    border-radius:40px;
    background:#ff1744;
    color:white;
    cursor:pointer;
    box-shadow:0 0 20px #ff1744;
    transition:.3s;
}

#showBtn:hover{
    transform:scale(1.1);
}

/* Photo */

.photo-container{
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
    transform:scale(.4);
    transition:1.5s;
}

.photo-container.show{
    opacity:1;
    transform:scale(1);
}

.photo-container img{
    width:300px;
    height:300px;
    object-fit:cover;
    border-radius:20px;
    border:6px solid white;
    box-shadow:0 0 40px #ff1744;
}

.photo-container h2{
    margin-top:20px;
    color:white;
    text-shadow:0 0 15px #ff1744;
}

/* Floating Hearts */

.floating-heart{
    position:absolute;
    color:#ff3366;
    animation:floatUp linear forwards;
}

@keyframes floatUp{
    from{
        transform:translateY(0) scale(.5);
        opacity:1;
    }

    to{
        transform:translateY(-120vh) scale(2) rotate(360deg);
        opacity:0;
    }
}

/* Sparkles */

.sparkle{
    position:absolute;
    animation:sparkle 2s linear forwards;
}

@keyframes sparkle{

0%{
opacity:0;
transform:scale(0);
}

50%{
opacity:1;
transform:scale(1);
}

100%{
opacity:0;
transform:scale(0);
}

}

</style>

</head>

<body>

<div class="heart">

<div class="heart-text">
BEST<br>FRIEND
</div>

</div>

<div class="message">
❤️ TO MY BEST FRIEND ❤️
</div>

<button id="showBtn">
❤️ Click Me ❤️
</button>

<div class="photo-container" id="photoContainer">

<img src="her-photo.jpg">

<h2>
Thank You For Being In My Life ❤️
</h2>

</div>

<script>

// Floating Hearts

function createHeart(){

const heart=document.createElement("div");

heart.className="floating-heart";

heart.innerHTML="❤";

heart.style.left=Math.random()*window.innerWidth+"px";

heart.style.bottom="-30px";

heart.style.fontSize=(15+Math.random()*35)+"px";

heart.style.animationDuration=(4+Math.random()*4)+"s";

heart.style.color=`hsl(${340+Math.random()*20},100%,60%)`;

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);

}

setInterval(createHeart,180);

// Sparkles

function createSparkle(){

const star=document.createElement("div");

star.className="sparkle";

star.innerHTML="✨";

star.style.left=Math.random()*window.innerWidth+"px";

star.style.top=Math.random()*window.innerHeight+"px";

star.style.fontSize=(10+Math.random()*20)+"px";

document.body.appendChild(star);

setTimeout(()=>{
star.remove();
},2000);

}

setInterval(createSparkle,300);

// Button Click

const btn=document.getElementById("showBtn");

const photo=document.getElementById("photoContainer");

const heart=document.querySelector(".heart");

const message=document.querySelector(".message");

btn.onclick=function(){

heart.style.transition="1s";

heart.style.opacity="0";

heart.style.transform="rotate(-45deg) scale(0)";

message.style.opacity="0";

btn.style.display="none";

setTimeout(()=>{

heart.style.display="none";

message.style.display="none";

photo.classList.add("show");

},1000);

}

</script>

</body>
</html>
