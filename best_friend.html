<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Friend Heart Animation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4,#ffdde1);
    animation:bgMove 10s infinite alternate;
    font-family:Arial,sans-serif;
}

@keyframes bgMove{
    from{
        filter:hue-rotate(0deg);
    }
    to{
        filter:hue-rotate(40deg);
    }
}

.heart{
    position:relative;
    width:170px;
    height:170px;
    background:#ff1744;
    transform:rotate(-45deg);
    animation:beat 1s infinite;
    box-shadow:
        0 0 30px #ff1744,
        0 0 60px #ff1744,
        0 0 90px #ff1744;
}

.heart::before,
.heart::after{
    content:'';
    position:absolute;
    width:170px;
    height:170px;
    background:#ff1744;
    border-radius:50%;
}

.heart::before{
    top:-85px;
    left:0;
}

.heart::after{
    left:85px;
    top:0;
}

@keyframes beat{
    0%,100%{
        transform:rotate(-45deg) scale(1);
    }
    25%{
        transform:rotate(-45deg) scale(1.08);
    }
    50%{
        transform:rotate(-45deg) scale(1.18);
    }
    75%{
        transform:rotate(-45deg) scale(1.08);
    }
}

.floating-heart{
    position:absolute;
    color:#ff3366;
    font-size:20px;
    animation:floatUp linear forwards;
    opacity:0.9;
    text-shadow:0 0 10px white;
}

@keyframes floatUp{
    0%{
        transform:translateY(0) scale(0.5) rotate(0deg);
        opacity:1;
    }

    100%{
        transform:translateY(-120vh) scale(2) rotate(360deg);
        opacity:0;
    }
}

.message{
    position:absolute;
    bottom:60px;
    width:100%;
    text-align:center;
    color:white;
    font-size:28px;
    font-weight:bold;
    letter-spacing:2px;
    text-shadow:0 0 15px #ff1744;
    animation:fade 2s infinite alternate;
    padding:0 10px;
}

@keyframes fade{
    from{
        opacity:0.5;
    }
    to{
        opacity:1;
    }
}
</style>

</head>
<body>

<div class="heart"></div>

<div class="message">
😊 TO MY BEST FRIEND 😊
</div>

<script>

function createHeart(){

    const heart=document.createElement("div");

    heart.classList.add("floating-heart");

    heart.innerHTML="❤";

    heart.style.left=Math.random()*window.innerWidth+"px";
    heart.style.bottom="-30px";
    heart.style.fontSize=(15+Math.random()*35)+"px";
    heart.style.animationDuration=(4+Math.random()*4)+"s";
    heart.style.color=`hsl(${340+Math.random()*20},100%,60%)`;

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },8000);

}

setInterval(createHeart,180);

</script>

</body>
</html>
