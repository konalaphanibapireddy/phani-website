<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Best Friend</title>

    <!-- Link CSS -->
    <link rel="stylesheet" href="birthday.css">
</head>

<body>

    <div class="card">
        <h1>🎂 Happy Birthday! 🎉</h1>

        <p>
            To my best friend,<br>
            May your day be filled with happiness, laughter, and joy 💖
        </p>

        <button onclick="showSurprise()">Click for Surprise 🎁</button>

        <div class="surprise" id="surpriseBox">
            <p>🌟 Wishing you success, happiness, and endless smiles! 🌟</p>

            <video id="birthdayVideo" controls>
                <source src="birthday.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </div>

    <audio id="birthdayMusic">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- Link JS -->
    <script src="birthday.js"></script>

</body>
</html>
