<!DOCTYPE html>
<html>
<head>
  <title>Birthday Surprise 🎉</title>
  <style>
    body {
      text-align: center;
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      font-family: Arial;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      background: #ff4081;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    video {
      margin-top: 20px;
      display: none;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <h1>🎂 Happy Birthday 🎂</h1>

  <button onclick="showSurprise()">🎁 Click for Surprise</button>

  <br>

  <video id="video" width="320" controls>
    <source src="birthday.mp4" type="video/mp4">
  </video>

  <script>
    function showSurprise() {
      let video = document.getElementById("video");
      video.style.display = "block";
      video.play();
    }
  </script>

</body>
</html>
