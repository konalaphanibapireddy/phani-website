<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Best Friend</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            overflow: hidden;
        }

        .card {
            text-align: center;
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            animation: pop 1s ease;
        }

        h1 {
            font-size: 36px;
            color: #ff4081;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            color: #444;
            line-height: 1.6;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            font-size: 18px;
            color: #fff;
            background: #ff4081;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            background: #e91e63;
            transform: scale(1.05);
        }

        .surprise {
            display: none;
            margin-top: 25px;
        }

        .surprise video {
            width: 100%;
            margin-top: 15px;
            border-radius: 15px;
        }

        @keyframes pop {
            from {
                transform: scale(0.7);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .balloon {
            position: absolute;
            bottom: -100px;
            width: 50px;
            height: 70px;
            border-radius: 50%;
            animation: float 6s linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-120vh);
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>🎂 Happy Birthday! 🎉</h1>

        <p>
            To my best friend,<br>
            May your day be filled with happiness, laughter, and joy 💖
        </p>

        <button onclick="showSurprise()">Click for Surprise 🎁</button>

        <div class="surprise" id="surpriseBox">
            <p>🌟 Wishing you success, happiness, and endless smiles! 🌟</p>

            <!-- Fixed Video -->
            <video id="birthdayVideo" width="2000" height="500" controls>
                <source src="birthday.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </div>

    <audio id="birthdayMusic">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        function showSurprise() {
            // Show surprise
            document.getElementById("surpriseBox").style.display = "block";

            // Play music
            const music = document.getElementById("birthdayMusic");
            music.play();

            // Play video
            const video = document.getElementById("birthdayVideo");
            video.play();

            // Balloons
            createBalloons();
        }

        function createBalloons() {
            for (let i = 0; i < 15; i++) {
                const balloon = document.createElement("div");
                balloon.classList.add("balloon");

                balloon.style.left = Math.random() * window.innerWidth + "px";
                balloon.style.backgroundColor = `hsl(${Math.random() * 360}, 70%, 60%)`;
                balloon.style.animationDuration = (4 + Math.random() * 3) + "s";

                document.body.appendChild(balloon);
            }
        }
    </script>

</body>

</html>
