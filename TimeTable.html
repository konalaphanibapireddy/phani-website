<!--Description: Design a timetable for classes. Use table rows and columns, and experiment with
colspan and rowspan.
Tags Covered: <table>, <tr>, <th>, <td>, colspan, <rowspan>-->
<html>

<head>
    <title>My Time Table</title>
</head>

<body>
    <h1>My Timetable</h1>
    <table border="2">
        <tr>
            <th>Time</th>
            <th>Monday</th>
            <th>Tuesday</th>
            <th>Wednesday</th>
        </tr>
        <tr>
            <td>9-10</td>
            <td>Maths</td>
            <td>Science</td>
            <td>English</td>
        </tr>
        <tr>
            <td>10-11</td>
            <td colspan="3">Break</td>
        </tr>
        <tr>
            <td>11-1</td>
            <td rowspan="2">Lab</td>
            <td>History</td>
            <td>sports</td>
        </tr>
        <tr>
            <td>1-2</td>
            <td>Math</td>
            <td>Science</td>
        </tr>
    </table>
</body>

</html>
